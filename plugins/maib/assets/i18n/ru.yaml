# Название плагина
plugin_name: "maib / Ядро ритм-игры Lyra"
help: "Помощь"

# link: запрос и привязка
link:
  query_disabled: "Функция запроса находится в разработке, скоро будет доступна!"
  only_qq: "Эта операция поддерживается только через QQ"
  tip: "Введите следующую команду в LyraBot на другой платформе, чтобы завершить привязку. Информация действительна в течение пяти минут."
  invalid_hash: "Указанный hash недействителен или истёк"
  not_found: "Соответствующая информация о привязке не найдена"
  success: "Привязка успешна!"
  unlink_success: "Отвязка успешна!"
  not_platform: "Неизвестная платформа"
  not_linked: "Похоже, вы ещё не привязали номер QQ~ Попробуйте использовать «绑定link» для привязки"
  onebot_no_bind: "Аккаунты QQ, которыми можно управлять напрямую (), нельзя привязать друг к другу"
