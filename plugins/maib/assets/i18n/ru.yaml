# ra_calc
rc:
  help: |-
    ra <константа> [процент завершения]
        Позволяет рассчитать DXRating
        константа: можно ввести напрямую или использовать форму вида id11951紫 для получения константы карты
        процент завершения: можно ввести напрямую, использовать выражения вроде «鸟家», «sss+» или оставить пустым для расчёта ra по диапазонам s~sss+
  achievement_invalid: "Пожалуйста, укажите правильный результат qwq"
  maidata_invalid: "Lyra не может разобрать указанную информацию о песне TT"
  level_invalid: "Пожалуйста, укажите правильную константу qwq"
  level_failed: "Lyra не может разобрать указанную информацию о константе TT"
  success:
    tip: "Lyra посчитала!"
    common: "константа {level}*{achievement}% -> Rating: {ra}"
    blur: "константа {level} {rate} -> Rating: {ra}"
  excluding_ap_bouns: "Этот ra не учитывает дополнительный бонус за AP!"

# adx_download (ad)
ad:
  help: |-
    下载谱面 [id] [ADX|ZIP]
        Позволяет скачать файл карты Simai, присутствующий в текущей базе данных
        Можно ответить на любое сообщение бота, содержащее число id карты, чтобы автоматически получить id
        [ADX|ZIP] — выбор формата файла карты, по умолчанию .adx, который AstroDX читает напрямую
  no_maidata: "Данные карты с id {short_id} не найдены! Возможно, она ещё не добавлена; обратитесь к смотрителю для подтверждения qwq"
  bad_id: "Пожалуйста, укажите правильный ID песни qwq"
  no_chart_file: "Файл карты не существует! Возможно, она ещё не добавлена; обратитесь к смотрителю для подтверждения qwq"
  prepare: "Подождите — Lyra начинает готовить файл карты id{target_short_id}!"
  error: "Lyra столкнулась с проблемой при обработке файла карты; обратитесь к смотрителю для подтверждения qwq"
  warn:
    no_folder: |-
      Lyra не нашла папку {folder_name}, поэтому загрузила {song_name} в корневой каталог ww
      Корневой каталог не может очищаться автоматически; лучше попросить администратора создать папку вручную
  success:
    qq_private: "Тук-тук~ Проверьте карту {song_name}!"
    qq_group: "Lyra уже отправила adx-карту {song_name} в группу!"
    tg: "wu~ Lyra уже отправила карту {song_name}!"

# mai_info
info:
  help: |-
    id<id> или info<id>
        Запрос информации о песне по id

    <название песни/псевдоним>是什么歌
        Запрос информации о песне по названию или псевдониму, с некоторой нечёткой логикой поиска
  invalid_id: "Пожалуйста, укажите правильный ID песни qwq"
  maidata_not_found: "Данные песни с id {short_id} не найдены qwq"
  # what_song
  found_none: "Не найдено данных о песнях, содержащих «{keyword}» qwq"
  found_single: "Возможно, вы ищете: {shortid}. {title}"
  found_multiple: "Lyra нашла {count} песен; проверьте, есть ли среди них нужная w"
  found_many: "Lyra перелистала много песен…… ууу, {count} штук ()"
  found_too_many_abort: "Слишком много! Сузьте диапазон поиска qwq"

# mai_alias (alias)
alias:
  help: |-
    添加别名 id<id> <псевдоним>
        Добавить псевдоним песне. Обратите внимание: псевдонимы стандартной и DX-карт не являются общими
  add:
    success: "Успешно добавлен псевдоним【{alias}】для {shortid}!"
    already_exists: "Похоже, этот псевдоним уже существует~"
  remove:
    deletion_not_supported: "Пока нельзя самостоятельно удалять псевдонимы~"

# b50
b50:
  help: |-
    b50 [CN|JP] или kkb [CN|JP]
        Позволяет нарисовать график результатов b50
        [CN|JP] означает построение графика для китайского или японского сервера
        Если нужен график для японского сервера, сначала загрузите данные японского сервера через lyra-sync
  all_not_supported: "Смешанные графики результатов ещё в разработке и пока недоступны qwq"
  qq_parsing_failed: "Lyra не нашла подходящую цель запроса……? Обратитесь к смотрителю для подтверждения"
  drawing: "Lyra рисует изображение b50, подождите……"
  other_updated: "Lyra обнаружила обновление данных Shuiyu у объекта запроса и уже обновила их для него/неё до последних!"
  no_jp_data: "У вас ещё нет данных японского сервера! Загрузите результаты через lyra-sync и попробуйте снова!"
  no_cn_data: "У вас ещё нет данных китайского сервера! Загрузите результаты Shuiyu и попробуйте снова!"

# sync
sync:
  # 非中国地区当前版本有意隐藏「获取同步码」
  help: |-
    sytb
        Принудительно синхронизировать данные Shuiyu вашего текущего пользователя. При рисовании b50 автоматически предпринимается попытка синхронизации данных Shuiyu
  help_maisync: |-
    lyra-maisync
    Ссылка для установки скрипта: https://github.com/goldsheep3/lyra-bot/raw/refs/heads/maib/plugins/maib/sync/lyra-maisync.user.js
    Удалённый адрес, который нужно указать в скрипте: https://lyra-ciane.icu
  sy:
    syncing: "Lyra пытается получить ваши последние данные результатов из Shuiyu!"
    no_update: "Проверено! Данные результатов в записях Lyra уже самые свежие."

# maime
maime:
  help: |-
    link aime <полный номер ACCESS>
        Привязать номер ACCESS карты Aime к вашему аккаунту

    unlink aime <полный номер ACCESS>
        Отвязать номер ACCESS карты Aime от вашего аккаунта

    find aime <последние 4 цифры ACCESS|полный номер ACCESS>
        Запросить информацию о привязке этого номера ACCESS, чтобы найти владельца карты

    list aime [full]
        Показать все номера карт Aime ACCESS, привязанные к вашему аккаунту; по умолчанию отображаются только первые и последние 4 цифры
  link:
    success: "Эта карта привязана к вашему аккаунту~"
    error:
      unknown: "При привязке карты произошла непредвиденная ошибка; обратитесь к смотрителю для подтверждения qwq"
      linked: "Эта карта уже привязана к другому аккаунту~"
      linked_self: "Эта карта уже привязана к вашему аккаунту~"
  unlink:
    success: "Эта карта отвязана от вашего аккаунта~"
    error:
      unknown: "При отвязке карты произошла непредвиденная ошибка; обратитесь к смотрителю для подтверждения qwq"
      not_found: "Информация о привязке этой карты не найдена~"
      not_owner: "Эта карта не принадлежит вашему аккаунту~"
  lost:
    find: "Для номера карты {card} найдена запись! Этот любитель ритм-игр оставил сообщение: {hint}"
    error:
      unknown: "При поиске карты произошла непредвиденная ошибка; обратитесь к смотрителю для подтверждения qwq"
      self: "Это же ваша карта——"
      not_link: "Эта карта была отвязана ранее и сейчас ни к кому не привязана мяу ("
      not_found: "Эта карта ещё не привязана мяу ("
      multiple_found: "Эта карта привязана к нескольким аккаунтам; придётся попробовать ещё раз с полным access qwq"

  list:
    empty: "Вы ещё не привязали ни одной карты~"
    header: "Вы привязали следующие карты:"
    item: "{access} ({create_at})"

