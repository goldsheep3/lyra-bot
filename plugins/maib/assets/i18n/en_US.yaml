# ra_calc
rc:
  help: |-
    ra_calc: ra <constant> [achievement]
        Calculates DXRating
        Constant: Can be entered directly, or use the form id11951紫 to get the chart constant
        Achievement: Can be entered directly, or use expressions like "鳥加" "sss+", or leave blank to calculate tiered ra for s~sss+
  achievement_invalid: "Please provide a valid score qwq"
  maidata_invalid: "Xiao Li couldn't parse the song information you provided TT"
  level_invalid: "Please provide a valid constant qwq"
  level_failed: "Xiao Li couldn't parse the constant information you provided TT"
  success:
    tip: "Xiao Li has calculated it!"
    common: "Constant {level}*{achievement}% -> Rating: {ra}"
    blur: "Constant {level} {rate} -> Rating: {ra}"
  excluding_ap_bouns: "This ra does not include the AP bonus score!"

