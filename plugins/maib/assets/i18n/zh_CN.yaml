# ra_calc
rc:
  help: |-
    ra_calc: ra <定数> [完成率]
        可以计算 DXRating
        定数: 可以直接输入，也可以使用 id11951紫 形式获取谱面定数
        完成率: 可以直接输入，也可以使用“鸟家”“sss+”等表达方式，或留空以计算s~sss+的分档ra
