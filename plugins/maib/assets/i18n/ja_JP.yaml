# ra_calc
rc:
  help: |-
    ra_calc: ra <定数> [達成率]
        DXRating を計算できます
        定数: 直接入力するか、id11951紫 の形式で譜面定数を取得できます
        達成率: 直接入力するか、「鳥加」「sss+」などの表現を使うか、省略して s～sss+ の段階別 ra を計算できます
  achievement_invalid: "正しい成績スコアを入力してくださいねqwq"
  maidata_invalid: "小梨はあなたが提供した楽曲情報を解析できませんでしたTT"
  level_invalid: "正しい定数を入力してくださいねqwq"
  level_failed: "小梨はあなたが提供した定数情報を解析できませんでしたTT"
  success:
    tip: "小梨が計算しました！"
    common: "定数{level}*{achievement}% -> Rating: {ra}"
    blur: "定数{level} {rate} -> Rating: {ra}"
  excluding_ap_bouns: "この ra は AP のボーナススコアを含みません！"

