# ra_calc
rc:
  help: |-
    ra <定数> [達成率]
        DXRating を計算できます
        定数: 直接入力するか、id11951紫 の形式で譜面定数を取得できます
        達成率: 直接入力するか、「鳥加」「sss+」などの表現を使用できます。省略した場合は S～SSS+ の段階別 ra を計算します。
  achievement_invalid: "おいおい、スコアが違うやんけ！ちゃんとした成績を入れんかいqwq"
  maidata_invalid: "アンタが送ってきた曲データ、解析できへんかったわ…堪忍なTT"
  level_invalid: "おいおい、定数が変やんけ！正しい数字を入れんかい、計算できへんがな！qwq"
  level_failed: "送られてきた曲データ、解析できへんかったわ…堪忍なTT"
  success:
    tip: "よっしゃ！計算したったで！"
    common: "定数{level}*{achievement}% -> Rating: {ra}"
    blur: "定数{level} {rate} -> Rating: {ra}"
  excluding_ap_bouns: "※このraはAPのボーナススコアを含みません。"

# adx_download (ad)
ad:
  help: |-
    download [id] [ADX|ZIP]
        現在のデータベースにある Simai 譜面ファイルをダウンロードします
        譜面 ID の数字を含む任意の bot メッセージに返信すると、自動的に ID を取得します
        [ADX|ZIP] で譜面ファイル形式を選択します。デフォルトは AstroDX で直接読み込める .adx です
  no_maidata: "id{short_id} の譜面データがどっこにも見つからへんわ…変やな"
  bad_id: "なんやねん！正しい楽曲IDを入れんかいqwq"
  no_chart_file: "譜面ファイルなんてありゃせんがやい！まだ収録されてへんみたいやな…保護者に連絡しといてくれ！"
  prepare: "ちょいと待ちな——今、id{target_short_id} の譜面を引っ張ってきとるわ！"
  error: "おい、譜面ファイルの処理でエラーや！管理者に言うたってくれ！"
  warn:
    no_folder: |-
      おいおい、{folder_name}フォルダが見つからへんがや…{song_name}はルートディレクトリに置いといたでww管理者に言うたってくれ！
  success:
    qq_private: "ヒャッハー！待たせたな！譜面「{song_name}」を受け取りな！"
    qq_group: "ワシが「{song_name}」のadx譜面をグループに送っちゃったで〜！"
    tg: "まいど！「{song_name}」の譜面を送ったがや！"

# mai_info
info:
  help: |-
    id<id> または info<id>
        ID で楽曲情報を検索します

    <楽曲名/別名>是什么歌
        楽曲名または別名で楽曲情報を検索します。あいまい検索にも対応しています
  invalid_id: "なんやねん！正しい楽曲IDを入れんかいqwq"
  maidata_not_found: "id{short_id} の曲データ、どっこにも見つからへんわ…堪忍なqwq"
  # what_song
  found_none: "「{keyword}」を含む曲データなんてありゃせんがや…ごめんねqwq"
  found_single: "これちゃうか？ {shortid}. {title} ニハハハ"
  found_multiple: "ニハハハ！{count}曲見つけたったで！お目当てのモン、あるか確認してみいw"
  # WARN: {count} 丢失
  found_many: "ワシ、めっちゃ色々見つけてしもた……多すぎて嬉しい悲鳴やなw"
  found_too_many_abort: "多すぎるやんけ！検索範囲をもうちょい絞ってくれへんか…！"

# mai_alias (alias)
alias:
  help: |-
    添加别名 id<id> <別名>
        楽曲に別名を追加します。通常譜面と DX 譜面の別名は共有されませんのでご注意ください。
  add:
    success: "{shortid} に別名【{alias}】を登録したったで！"
    already_exists: "おっと、この別名はもう登録されてるみたいやで。"
    failed:
      unknown: "別名の追加中になんかエラーが出たわ…管理者に言うたってくれ。"
  remove:
    deletion_not_supported: "現在、別名の削除機能はサポートされていません。"
    not_found: "その別名、どっこ探しても見つからへんかったわ…"
    not_owner: "おいおい、この別名はアンタが追加したもんちゃうやろ！"
    success: "{shortid} から別名【{alias}】を消しといたで"
    failed:
      unknown: "別名を消す時にエラーが出たわ…すまんな。"

# b50
b50:
  help: |-
    b50 [CN|JP] または kkb [CN|JP]
    b50 の成績画像を生成します。
    [CN|JP] は、中国版または日本版の成績画像を生成することを示します。
    日本版の成績画像を生成するには、先に lyra-sync で日本版の成績データをアップロードしてください。
    中国版の成績画像を生成するには、先に lyra-sync で中国版の成績データをアップロードしてください。
  all_not_supported: "混合サーバーの成績画像はまだ準備中やで！今はちょっと待っときw"
  qq_parsing_failed: "おいおい、アンタのデータが見つからへんがや…ちゃんと連携しとるか？管理者に言うたってくれ！"
  drawing: "ちょいと待ちな、今からb50の画像、描いたるわ。"
  other_updated: "おっ、アンタのスコアデータが更新されとるで！最新のを取ってきたったわ！"
  no_jp_data: "日本サーバーのデータなんてありゃせんがや！先に lyra-sync で同期しとき！"
  no_cn_data: "中国サーバーのデータがないで！先に水魚查分器と同期せんかい！"

# sync
sync:
  # 非中国地区当前版本有意隐藏「获取同步码」
  help: |-
    sytb
        現在のユーザーのスコアデータを強制同期します。b50 画像の生成時にも、自動で同期を試みます。
  help_maisync: |-
    lyra-maisync
    スクリプトのインストールリンク：https://github.com/goldsheep3/lyra-bot/raw/refs/heads/maib/plugins/maib/sync/lyra-maisync.user.js
    スクリプトで設定するリモートアドレス：https://lyra-ciane.icu
  sy:
    syncing: "おっしゃ！外部スコアサイトから最新の成績データを引っ張ってきとるわ…待っとき！"
    no_update: "おう、確認したで！アンタの成績データ、もう最新や！"

# maime
maime:
  help: |-
    link aime <ACCESS カード番号全桁>
        Aime の ACCESS カード番号をアカウントに連携します。

    unlink aime <ACCESS カード番号全桁>
        Aime の ACCESS カード番号との連携を解除します。

    find aime <ACCESS の下4桁|ACCESS カード番号全桁>
        ACCESS カード番号から連携情報を検索します。

    list aime [full]
        連携済みの Aime カード番号を全表示します。初期設定では上4桁と下4桁のみ表示されます。
  link:
    success: "おう、このカード、アンタのアカウントに連携しといたで！"
    error:
      unknown: "おいおい、カードの連携中に変なエラーが出たがや…保護者に確認しといてくれqwq"
      linked: "おっと、このカードはもう他のアカウントに連携されとるわ～"
      linked_self: "おいおい、これアンタのカードやないか！もう連携しとるで！"
  unlink:
    success: "ほらよ、このカード、アンタのアカウントから解除しといたわ！"
    error:
      unknown: "おいおい、カードの解除中に変なエラーが出たがや…保護者に確認しといてくれqwq"
      not_found: "そのカードの連携情報、どっこにも見つからへんわ～"
      not_owner: "おいおい、このカードはアンタのアカウントのもんちゃうやろ！"
  lost:
    find: "おっ、カード番号 {card} の記録が見つかったで！この音ゲー中毒者が、こんなメッセージ残しとるわ：{hint}"
    error:
      unknown: "あれぇ？カードの検索がうまくいかへんわ…変なエラーが出たみたいや。保護者に言うたってくれqwq"
      self: "ちょっと待てや！このカード、おまん自身のやないかーい！"
      not_link: "おや？このカード、前に解除されたっきり、今は誰のモンでもないみたいやで～"
      not_found: "なんや、このカードはまだ誰にも連携されてへんがやな。"
      multiple_found: "なんやこれ！一枚のカードが複数のアカウントに紐付いとるがや！完全なACCESS番号で検索し直してくれqwq"

  list:
    empty: "あらま、まだ一枚もカードを連携してへんのかい！"
    header: "連携済みカード一覧："
    item: "{access} ({create_at})"

