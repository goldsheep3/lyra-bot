# ra_calc
rc:
  help: |-
    ra <定数> [達成率]
        DXRating を計算できます
        定数: 直接入力するか、id11951紫 の形式で譜面定数を取得できます
        達成率: 直接入力するか、「鳥加」「sss+」などの表現を使うか、省略して s～sss+ の段階別 ra を計算できます
  achievement_invalid: "正しい成績スコアを入力してくださいねqwq"
  maidata_invalid: "小梨はあなたが提供した楽曲情報を解析できませんでしたTT"
  level_invalid: "正しい定数を入力してくださいねqwq"
  level_failed: "小梨はあなたが提供した定数情報を解析できませんでしたTT"
  success:
    tip: "小梨が計算しました！"
    common: "定数{level}*{achievement}% -> Rating: {ra}"
    blur: "定数{level} {rate} -> Rating: {ra}"
  excluding_ap_bouns: "この ra は AP のボーナススコアを含みません！"

# adx_download (ad)
ad:
  help: |-
    download [id] [ADX|ZIP]
        現在のデータベースにある Simai 譜面ファイルをダウンロードできます
        譜面 ID の数字を含む任意の bot メッセージに返信すると、自動的に ID を取得できます
        [ADX|ZIP] で譜面ファイル形式を選択します。デフォルトは AstroDX で直接読み込める .adx です
  no_maidata: "id{short_id}の譜面データが見つかりませんでした！まだ収録されていない可能性があります。保護者に確認してくださいねqwq"
  bad_id: "正しい楽曲 ID を入力してくださいねqwq"
  no_chart_file: "譜面ファイルが存在しません！まだ収録されていない可能性があります。保護者に確認してくださいねqwq"
  prepare: "少々お待ちください——小梨が id{target_short_id} の譜面ファイルを準備します！"
  error: "小梨が譜面ファイルの処理中に問題が発生しました。保護者に確認してくださいねqwq"
  warn:
    no_folder: |-
      小梨は{folder_name}フォルダを見つけられなかったので、{song_name}をルートディレクトリにアップロードしたよww
      ルートディレクトリは自動清理できないから、管理者に手動で作ってもらうのがいいよ
  success:
    qq_private: "じゃじゃーん～譜面 {song_name} をお受け取りください！"
    qq_group: "小梨が {song_name} のadx譜面をグループに送信しました！"
    tg: "wu～小梨が {song_name} の譜面を送信しました！"

# mai_info
info:
  help: |-
    id<id> または info<id>
        ID で楽曲情報を検索します

    <楽曲名/別名>是什么歌
        楽曲名または別名で楽曲情報を検索します。あいまい検索にも対応しています
  invalid_id: "正しい楽曲 ID を入力してくださいねqwq"
  maidata_not_found: "id{short_id} の楽曲データが見つかりませんでしたqwq"
  # what_song
  found_none: "「{keyword}」を含む楽曲データが見つかりませんでしたqwq"
  found_single: "お探しはこちらですか：{shortid}. {title}"
  found_multiple: "小梨が {count} 曲見つけました。お探しのものがあるか確認してくださいねw"
  found_many: "小梨がたくさん見つけました……うわぁ、{count}曲（）"
  found_too_many_abort: "多すぎます！検索範囲を絞ってくださいねqwq"

# mai_alias (alias)
alias:
  help: |-
    添加别名 id<id> <別名>
        楽曲に別名を追加します。通常譜面と DX 譜面の別名は共有されないのでご注意ください
  add:
    success: "{shortid} に別名【{alias}】を追加しました！"
    already_exists: "この別名はすでに存在するようです～"
  remove:
    deletion_not_supported: "現在、別名のセルフ削除はサポートされていません～"

# b50
b50:
  help: |-
    b50 [CN|JP] または kkb [CN|JP]
        b50 の成績画像を生成できます
        [CN|JP] は中国版または日本版の成績画像を生成する指定です
        日本版の成績画像を生成するには、先に lyra-sync で日本版の成績データをアップロードしてください
  all_not_supported: "混合成績画像は開発中です。現在ご利用いただけませんqwq"
  qq_parsing_failed: "小梨が適切なクエリ対象を見つけられませんでした……？保護者に確認してください"
  drawing: "小梨が b50 画像を描画中です。少々お待ちください……"
  other_updated: "小梨がクエリ対象の水魚データに更新があることを検出し、最新版に更新しました！"
  no_jp_data: "日本サーバーのデータがありません！lyra-sync で成績をアップロードしてから再試行してください！"
  no_cn_data: "中国サーバーのデータがありません！水魚に成績をアップロードしてから再試行してください！"

# sync
sync:
  help: |-
    sytb
        現在のユーザーの水魚データを強制的に同期します。b50 の画像生成時にも水魚データの同期を自動的に試みます

    获取同步码
        lyra-maisync の同期コードを取得します。lyra-maisync のユーザースクリプトによる自動アップロードに使用します
        /help maisync でスクリプトのリンクとリモートアドレスを確認できます
  help_maisync: |-
    lyra-maisync
    スクリプトのインストールリンク：https://github.com/goldsheep3/lyra-bot/raw/refs/heads/maib/plugins/maib/sync/lyra-maisync.user.js
    スクリプトで設定するリモートアドレス：https://lyra-ciane.icu
  sy:
    syncing: "小梨が水魚查分器から最新の成績データを取得しようとしています！"
    no_update: "確認しました！小梨が記録している成績データはすでに最新です。"

# maime
maime:
  help: |-
    绑定aime <ACCESS カード番号全桁>
        Aime の ACCESS カード番号をあなたのアカウントにバインドします

    解绑aime <ACCESS カード番号全桁>
        あなたのアカウントから Aime の ACCESS カード番号のバインドを解除します

    查询aime <ACCESS の下4桁|ACCESS カード番号全桁>
        ACCESS カード番号のバインド情報を検索し、カードの所有者を探します
  link:
    success: "このカードをあなたのアカウントにバインドしました～"
    error:
      unknown: "カードのバインド中に予期しないエラーが発生しました。保護者に確認してくださいねqwq"
      linked: "このカードはすでに他のアカウントにバインドされています～"
  unlink:
    success: "このカードをあなたのアカウントからバインド解除しました～"
    error:
      unknown: "カードのバインド解除中に予期しないエラーが発生しました。保護者に確認してくださいねqwq"
      not_found: "このカードのバインド情報が見つかりませんでした～"
      not_owner: "このカードはあなたのアカウントに属していません～"
  lost:
    success: "カード番号 {card} は {qq} のものです。その音ゲー中毒者に連絡してみてくださいにゃ（"
    error:
      not_found: "このカードはまだここでバインドされたことがないか、バインド解除された状態ですにゃ（"
      multiple_found: "このカードは複数のアカウントにバインドされています。完全な access で再試行してくださいqwq"

  list:
    empty: "まだカードをバインドしていません～"
    header: "以下のカードをバインドしています："
    item: "{masked} ({create_at})"
    item_full: "{access} ({create_at})"

