  invalid_user_id: "str 形式の user_id を解析できない: {raw_uid}"
  user_not_found: "連携済みの QQ アカウントが見つからないから、先に link 機能で QQ 番号を連携してね"
  unexpected: "未対応のプラットフォームだよ"
  common: "予期せぬエラーが起きたから、管理者に確認してねqwq"
  platform_not_supported: "予期せぬエラー（Platform Not Supported）が起きたから、管理者に確認してねqwq"
